name: Opdater og Udgiv Kystindex

on:
  # Køres udefra (f.eks. fra cron-job.org) eller manuelt
  workflow_dispatch:
  
# Sæt tilladelser op til både at skrive til kildekode og GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Sørg for at kun én deployment kører ad gangen
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hent kildekode
        uses: actions/checkout@v4

      - name: Sæt Python op
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer afhængigheder
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Kør generator-script (laver index.html)
        run: python generate_html.py

      - name: Commit og push opdateret index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (git commit -m "Auto-update index.html [skip ci]" && git push)

      - name: Konfigurer GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload filer til deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Sender både index.html, logo.png m.m. af sted

      - name: Udgiv til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
